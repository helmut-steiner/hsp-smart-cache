name: PHPUnit

on:
  push:
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check admin asset formatting
        if: matrix.php == '8.4'
        run: npm run lint:assets

      - name: Run PHPUnit in wp-env
        shell: pwsh
        run: ./bin/run-wp-env-tests.ps1

      - name: Check WordPress Coding Standards
        if: matrix.php == '8.4'
        run: node ./bin/wp-env-named.js run tests-cli --env-cwd=wp-content/plugins/hsp-smart-cache composer lint:php

      - name: Stop wp-env
        if: always()
        run: npm run wp-env:stop
