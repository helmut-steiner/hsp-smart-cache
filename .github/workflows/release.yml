name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/phpunit.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Validate version and prepare release message
        run: |
          python3 -B bin/release-notes.py --tag "$GITHUB_REF_NAME" \
            --plugin hsp-smart-cache.php --constant HSPSC_VERSION \
            --output "$RUNNER_TEMP/release-notes.md"

      - name: Build plugin zip
        id: build_zip
        run: |
          PLUGIN_SLUG="hsp-smart-cache"
          ZIP_NAME="${PLUGIN_SLUG}-${GITHUB_REF_NAME}.zip"
          mkdir -p "dist/${PLUGIN_SLUG}"

          rsync -a --relative \
            hsp-smart-cache.php uninstall.php readme.txt LICENSE \
            includes dropins languages assets "dist/${PLUGIN_SLUG}/"

          (cd dist && zip -r "../${ZIP_NAME}" "${PLUGIN_SLUG}")
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify remote tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET: ${{ steps.build_zip.outputs.zip_name }}
        run: |
          test -f "$RELEASE_ASSET"
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          remote_refs="$(git ls-remote --exit-code origin "$tag_ref" "${tag_ref}^{}")"
          remote_commit="$(awk -v ref="$tag_ref" '
            $2 == ref { tag = $1 }
            $2 == ref "^{}" { peeled = $1 }
            END { print peeled ? peeled : tag }
          ' <<< "$remote_refs")"
          if [ "$remote_commit" != "$(git rev-parse HEAD)" ]; then
            echo "::error::The release tag no longer points to the packaged commit."
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$GITHUB_REF_NAME" "$RELEASE_ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$RELEASE_ASSET" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
